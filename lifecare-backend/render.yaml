services:
    - type: web
    name: lifecare-appointment-service
    env: node
    plan: free
    buildCommand: pnpm install && pnpm prisma generate --schema=./apps/appointment-service/prisma/schema.prisma && pnpm run build appointment-service
    startCommand: pnpm run start:prod appointment-service
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: lifecare-db
          property: connectionString
            - key: PORT
        value: 4002

    - type: web
    name: lifecare-api-gateway
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build api-gateway
    startCommand: pnpm run start:prod api-gateway
    envVars:
            - key: APPOINTMENT_SERVICE_URL
        fromService:
          type: web
          name: lifecare-appointment-service
          property: host
            - key: PORT
        value: 4000

databases:
    - name: lifecare-db
    plan: free
    databaseName: lifecare
    user: lifecare
